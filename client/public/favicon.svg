<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="8" fill="#000000"/>
  <!-- Solana-style gradient coin -->
  <circle cx="16" cy="16" r="12" fill="url(#grad)" opacity="0.15"/>
  <!-- Solana-style stacked bars -->
  <rect x="8" y="10" width="14" height="2.5" rx="1.25" fill="url(#grad)"/>
  <rect x="10" y="14.75" width="12" height="2.5" rx="1.25" fill="url(#grad)"/>
  <rect x="8" y="19.5" width="14" height="2.5" rx="1.25" fill="url(#grad)"/>
  <defs>
    <linearGradient id="grad" x1="8" y1="10" x2="22" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9945FF"/>
      <stop offset="100%" stop-color="#14F195"/>
    </linearGradient>
  </defs>
</svg>
