<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="100" fill="#000000"/>
  <!-- Background glow -->
  <circle cx="256" cy="256" r="200" fill="url(#grad)" opacity="0.12"/>
  <!-- Solana-style stacked bars -->
  <rect x="128" y="160" width="224" height="40" rx="20" fill="url(#grad)"/>
  <rect x="160" y="236" width="192" height="40" rx="20" fill="url(#grad)"/>
  <rect x="128" y="312" width="224" height="40" rx="20" fill="url(#grad)"/>
  <defs>
    <linearGradient id="grad" x1="128" y1="160" x2="352" y2="352" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9945FF"/>
      <stop offset="100%" stop-color="#14F195"/>
    </linearGradient>
  </defs>
</svg>
