  <rect x="16" y="232" width="240" height="48" rx="8" fill="#0f0f0f" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="16" y="288" width="240" height="48" rx="8" fill="#0f0f0f" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="16" y="344" width="240" height="48" rx="8" fill="#0f0f0f" stroke="#1a1a1a" stroke-width="1"/>
