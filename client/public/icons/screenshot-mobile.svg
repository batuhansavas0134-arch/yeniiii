  <rect x="56" y="16" width="140" height="10" rx="5" fill="url(#logoGrad)" opacity="0.8"/>
  <rect x="56" y="32" width="100" height="7" rx="3.5" fill="#333"/>
  <!-- Tab bar -->
  <rect x="120" y="12" width="150" height="32" rx="8" fill="#111"/>
